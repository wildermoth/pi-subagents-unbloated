name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test

  integration:
    # Runs the gated tests against a real Pi. The pinned Pi (devDependency) is
    # installed by `bun install` and put on PATH. Pi needs Node >= 22.19; CI runs the current LTS.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - run: pi --version
      - run: bun test
        env:
          PI_INTEGRATION: "1"

  bench:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - run: |
          mkdir -p bench-out
          bun bench/startup.ts 10 | tee bench-out/startup.txt
          bun bench/context.ts | tee bench-out/context.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench
          path: bench-out
